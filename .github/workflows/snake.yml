name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Dark Neon Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#00FFFF&color_dots=#050505,#071A1A,#004D4D,#00A6A6,#00FFFF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00FFFF
            dist/github-snake.gif?color_snake=#00FFFF&color_dots=#050505,#071A1A,#004D4D,#00A6A6,#00FFFF&color_background=#050505

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
